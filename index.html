<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JobCharcha - Verified Government & Private Job Vacancies 2026</title>
    <meta name="description" content="JobCharcha is India's leading portal for government recruitment notifications, UPSC, SSC, Banking, Railways, State PSCs, admit cards, results, CBT mock tests, and youth schemes." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- API origin is on the critical path (categories/settings load on first paint). -->
    <link rel="preconnect" href="https://job.jobcharcha.com" crossorigin>
    <!-- Razorpay is loaded on demand (see src/utils/loadRazorpay.ts); warm the DNS/TLS early. -->
    <link rel="dns-prefetch" href="https://checkout.razorpay.com">
    <!-- Fonts load without blocking first paint (media=print swap trick); the system font shows until they arrive. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap"></noscript>
    <meta name="theme-color" content="#1d4ed8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JobCharcha">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="icon" type="image/png" href="/icons/favicon.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- Google tag (gtag.js): GA4 + Google Ads share one dataLayer/script. gtag() calls
         below queue into dataLayer immediately; gtag.js (loaded on window 'load' so it
         never blocks first paint) drains the queue once it arrives. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag('js', new Date());
      // send_page_view:false — AnalyticsPageView sends one page_view per route (incl. the first); leaving the default on counted every landing twice.
      gtag('config', 'G-BQHGCRK48X', { send_page_view: false });
      gtag('config', 'AW-17821775814');

      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-BQHGCRK48X';
        s.async = true;
        document.head.appendChild(s);
      });
    </script>

    <!-- AdSense: deferred until the user actually interacts (or after 8s) so it never
         competes with the SPA bundle for bandwidth on first load. -->
    <script>
      function loadAdSense() {
        if (window.adsenseLoaded) return;
        window.adsenseLoaded = true;
        var s = document.createElement('script');
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7367321121987492';
        s.async = true; s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
      }
      ['mousedown', 'touchstart', 'scroll', 'keydown'].forEach(function (e) {
        window.addEventListener(e, loadAdSense, { once: true, passive: true });
      });
      window.addEventListener('load', function () { setTimeout(loadAdSense, 8000); });
    </script>
  </head>
  <body class="bg-[#f5f7f8] text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
