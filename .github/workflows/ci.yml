name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/JobPortal.Api/JobPortal.Api.csproj

      - name: Build
        run: dotnet build backend/JobPortal.Api/JobPortal.Api.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/JobPortal.Tests/JobPortal.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build
